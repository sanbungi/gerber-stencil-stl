<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerber ステンシル STL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — drop zone, thickness, download; advanced settings folded away */
:root {
  --bg: #eef0ef; --panel: #ffffff; --line: #c9cfcb; --fg: #1d2421; --muted: #5d6963;
  --accent: #1d6b4a; --accent-ink: #ffffff; --bad: #b3261e;
  --font: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121715; --panel: #1a201d; --line: #2e3833; --fg: #e3e8e5; --muted: #95a39b; --accent: #3fae7d; --accent-ink: #08130e; --bad: #ef6b60; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121715; --panel: #1a201d; --line: #2e3833; --fg: #e3e8e5; --muted: #95a39b; --accent: #3fae7d; --accent-ink: #08130e; --bad: #ef6b60; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
main { max-width: 440px; margin: 0 auto; padding-inline: 16px; padding-block: 48px; display: grid; gap: 16px; }
h1 { font-size: 20px; margin: 0; }
.drop { background: var(--panel); border: 2px dashed var(--line); border-radius: 8px; padding: 32px 16px; text-align: center; cursor: pointer; display: grid; gap: 6px; }
.drop:hover, .drop.over { border-color: var(--accent); }
.drop:focus-visible, input:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop .sub { color: var(--muted); font-size: 13px; }
.got { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 13px; }
.got span { padding: 1px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.got span.on { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row label { font-weight: 500; }
.row .unit { display: flex; align-items: center; gap: 6px; color: var(--muted); }
input[type="number"], select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input[type="number"] { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
button { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px; cursor: pointer; }
button:disabled { opacity: .4; cursor: not-allowed; }
.status { font-size: 13px; color: var(--muted); min-height: 1.5em; margin: 0; }
.status.bad { color: var(--bad); }
details { font-size: 14px; }
summary { cursor: pointer; color: var(--muted); }
.adv { display: grid; gap: 10px; padding-top: 12px; }
.adv .row label { font-weight: 400; }
</style>

</head>
<body>
<main>
  <h1>Gerber ステンシル STL</h1>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Gerber ファイルを選ぶ">
    <strong>Edge_Cuts と Paste の Gerber をドロップ</strong>
    <span class="sub">またはクリックして選択</span>
    <div class="got"><span id="gotEdge">Edge_Cuts</span><span id="gotPaste">Paste</span></div>
  </div>
  <input type="file" id="fileInput" multiple accept=".gbr,.gko,.gm1,.gtp,.gbp,.ger" hidden>

  <div class="row">
    <label for="thickness">厚み</label>
    <span class="unit"><input type="number" id="thickness" value="0.25" step="0.05" min="0.05" max="2">mm</span>
  </div>

  <button id="download" type="button" disabled>STL ダウンロード</button>
  <p class="status" id="status" role="status"></p>

  <details>
    <summary>アドバンス</summary>
    <div class="adv">
      <div class="row"><label for="side">面</label><select id="side"><option value="F">F (表)</option><option value="B">B (裏)</option></select></div>
      <div class="row"><label for="lip">位置合わせ枠</label><input type="checkbox" id="lip" checked></div>
      <div class="row"><label for="lipHeight">枠の高さ</label><span class="unit"><input type="number" id="lipHeight" value="1.2" step="0.1" min="0.2" max="5">mm</span></div>
      <div class="row"><label for="clearance">基板とのすき間</label><span class="unit"><input type="number" id="clearance" value="0.15" step="0.05" min="0" max="1">mm</span></div>
      <div class="row"><label for="wall">枠の幅</label><span class="unit"><input type="number" id="wall" value="1.6" step="0.1" min="0.4" max="10">mm</span></div>
      <div class="row"><label for="flange">外側のつば</label><span class="unit"><input type="number" id="flange" value="0" step="0.5" min="0" max="30">mm</span></div>
      <div class="row"><label for="shrink">開口の縮小（片側）</label><span class="unit"><input type="number" id="shrink" value="0" step="0.01" min="-0.3" max="0.3">mm</span></div>
    </div>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="stencil-core.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const files = {}; // edge / F / B -> {name, text}
  let baseName = 'stencil';

  function setStatus(t, bad) { const s = $('status'); s.textContent = t; s.classList.toggle('bad', !!bad); }
  function refresh() {
    const side = $('side').value, paste = files[side] || files.F || files.B;
    $('gotEdge').classList.toggle('on', !!files.edge);
    $('gotPaste').classList.toggle('on', !!files[side]);
    $('gotEdge').textContent = files.edge ? '✓ ' + files.edge.name : 'Edge_Cuts';
    $('gotPaste').textContent = paste ? (files[side] ? '✓ ' : '') + paste.name : 'Paste';
    $('download').disabled = !(files.edge && files[side]);
    setStatus(files.edge && paste && !files[side] ? side + ' 面の Paste がありません' : '', true);
  }
  async function handle(list) {
    for (const f of list) {
      const text = await f.text();
      const role = StencilCore.detectRole(f.name, text);
      if (!role) { setStatus(f.name + ' は Edge_Cuts / Paste として認識できませんでした', true); return; }
      files[role] = { name: f.name, text };
      if (role === 'edge') baseName = f.name.replace(/[-_]?edge[_.\- ]?cuts.*$/i, '').replace(/\.[^.]+$/, '') || 'stencil';
      if (role === 'F' || role === 'B') $('side').value = role;
    }
    refresh();
  }

  const drop = $('drop'), fi = $('fileInput');
  drop.onclick = () => fi.click();
  drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
  fi.onchange = () => { handle([...fi.files]); fi.value = ''; };
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => handle([...e.dataTransfer.files]));
  $('side').onchange = refresh;

  const num = (id, d) => { const v = parseFloat($(id).value); return isNaN(v) ? d : v; };
  $('download').onclick = async () => {
    const side = $('side').value, btn = $('download');
    let r;
    try {
      r = StencilCore.generate(files.edge.text, files[side].text, {
        side, thickness: Math.max(0.05, num('thickness', 0.25)), lip: $('lip').checked,
        lipHeight: num('lipHeight', 1.2), clearance: Math.max(0, num('clearance', 0.15)),
        wall: num('wall', 1.6), flange: Math.max(0, num('flange', 0)), shrink: num('shrink', 0),
      });
    } catch (e) { setStatus(e.message, true); return; }
    if (!r.stats.apertures) { setStatus(side + ' 面にペースト開口がありません', true); return; }
    const name = `${baseName}_${side}_stencil_${r.options.thickness}mm`;
    const buf = StencilCore.stl(r.tris, name);
    btn.disabled = true;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) {
        // the viewer only saves common formats, so the STL travels inside a zip
        const zip = new JSZip(); zip.file(name + '.stl', buf);
        await dl.save({ filename: name + '.zip', data: await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }) });
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/stl' })); a.download = name + '.stl';
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
      const s = r.stats;
      setStatus(`${s.size.w.toFixed(1)} × ${s.size.d.toFixed(1)} × ${s.size.h.toFixed(2)} mm ・ 開口 ${s.apertures}` + (r.warnings.length ? ' ・ ' + r.warnings.join(' / ') : ''));
    } catch (e) {
      const declined = e && e.code === 'declined';
      setStatus(declined ? 'キャンセルしました' : '保存できませんでした: ' + ((e && (e.message || e.code)) || e), !declined);
    } finally { btn.disabled = false; }
  };
  refresh();
})();
</script>
</body>
</html>
